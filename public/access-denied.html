<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HostelCare :: Access Denied (403)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/jpeg" href="/images/logo.jpg">
  <style>
    .denied-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      padding: 1.5rem;
    }
    .denied-card {
      max-width: 540px;
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-lg);
      padding: 3rem 2.5rem;
      text-align: center;
      box-shadow: var(--shadow-lg);
    }
    .denied-icon {
      margin-bottom: 1.25rem;
      display: flex;
      justify-content: center;
    }
    .denied-title {
      font-family: var(--font-heading);
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--slate-900);
    }
    .denied-desc {
      font-size: 0.95rem;
      color: var(--slate-600);
      margin: 0.85rem 0 1.75rem;
      line-height: 1.6;
    }
    .btn-return {
      padding: 0.75rem 1.5rem;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="denied-wrapper">
    <div class="denied-card">
      <div class="denied-icon">
        <img src="/images/logo.png" alt="Integral University Logo" style="width:72px; height:72px; border-radius:50%; object-fit:contain; background:#ffffff; padding:2px; box-shadow:0 4px 14px rgba(0,0,0,0.12); border:2px solid var(--slate-200);">
      </div>
      <h1 class="denied-title">403: Access Denied</h1>
      <p class="denied-desc">
        You do not have the required role privileges to access this dashboard.
        In HostelCare, students, category supervisors, and the Chief Provost have strict level-of-access separation.
      </p>
      <div style="display:flex; justify-content:center; gap:0.75rem;">
        <a href="/" class="btn btn-primary btn-return">Return to My Authorized Dashboard</a>
        <button id="btnLogout" class="btn btn-secondary btn-return">Sign Out</button>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('btnLogout').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });
  </script>
</body>
</html>
